spring.application.name=backend

# --- Local development profile ---
# application-dev.properties adds verbose SQL/HTTP logging and other
# dev-only conveniences on top of everything below. It's not active by
# default - opt in with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev        (Mac/Linux)
#   mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev      (Windows)
# or by setting the SPRING_PROFILES_ACTIVE=dev environment variable.

# --- Database ---
# Values come from environment variables, never hardcoded, so real
# credentials are never something you could accidentally commit. Defaults
# below are safe placeholders for local dev only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Closes the entity manager at the end of the transaction instead of the
# whole request - avoids the "open session in view" anti-pattern, which
# hides N+1 queries and holds a DB connection open for the full request.
spring.jpa.open-in-view=false

# --- Connection pool (HikariCP) tuning ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# --- Java 25 / Project Loom ---
# Each request (and each blocking JDBC call within it) runs on a cheap
# virtual thread instead of a pooled platform thread. Raises the throughput
# ceiling under load with zero application code changes.
spring.threads.virtual.enabled=true

# --- Code / error exposure prevention ---
# Never leak stack traces, exception messages, or field-binding internals
# through Spring's own fallback /error page. GlobalExceptionHandler covers
# the normal JSON API path; these cover everything else (404s, framework-
# level failures before the handler runs, etc).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# --- CORS allow-list (see WebConfig) ---
# Comma-separated list, override per environment instead of the previous
# wildcard "*".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
