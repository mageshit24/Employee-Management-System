# Local-development overrides, layered on top of application.properties
# when the "dev" profile is active (see the note at the top of
# application.properties for how to enable it). Everything here trades
# quieter/faster/safer production behavior for visibility while coding -
# none of it belongs on by default.

# --- SQL visibility ---
# Print every generated SQL statement, formatted and with bind parameter
# values, to the console. Invaluable for spotting an accidental N+1 or a
# query that isn't using the index you expected; far too noisy (and a
# minor information exposure) to leave on in a deployed environment.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# --- HTTP request visibility ---
# Logs each incoming request/response at DEBUG, and this application's own
# code at DEBUG so log statements added while debugging are actually
# visible without needing a redeploy to change the log level.
logging.level.org.springframework.web=debug
logging.level.magesh.ems.backend=debug

# --- DevTools ---
# spring-boot-devtools (see backend/pom.xml) is already restart/LiveReload
# capable with no configuration - these two just make the trigger
# obvious and disable the response-caching template caches it would
# otherwise leave on, which is what you want while actively editing.
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# --- Error detail ---
# Full validation-binding detail in error responses while developing the
# frontend against this API - still never a raw stack trace, since
# server.error.include-stacktrace stays "never" (inherited from
# application.properties; deliberately not overridden here).
server.error.include-binding-errors=always
server.error.include-message=always
